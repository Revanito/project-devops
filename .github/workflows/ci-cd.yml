name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: frontend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: todolist_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: todolist_db
      DB_DIALECT: mysql
      PORT: 3000
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Installe les dépendances pour le job de test
      - run: npm ci

      # Exécute les tests unitaires et d'intégration (Jest + Supertest)
      # --runInBand : les deux suites partagent la même vraie base MySQL et font
      # chacune un sync({force:true}) sur la table Tasks -> en parallèle (comportement
      # par défaut de Jest), elles se marchent dessus. On les force en série.
      - name: Exécuter les tests backend
        run: npm test -- --runInBand

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Installe les dépendances pour le job de test
      - run: npm ci

      # Exécute les tests unitaires Angular en mode Chrome headless
      - name: Exécuter les tests unitaires
        run: npx ng test --watch=false --browsers=ChromeHeadless

  frontend-build:
    needs: [frontend-test, backend-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Configure Node.js pour l’environnement de build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Installe les dépendances pour le job de build
      - run: npm ci

      # Génère le fichier environment.prod.ts avec l’URL de l’API en production
      # Le système d'ingress d'AKS permet d'exposer le backend et le frontend via un reverse proxy
      # On définit donc l'URL de l'API comme '/api' pour que les appels soient redirigés vers le backend via l'ingress
      # Adapter apiUrl selon l'host utilisé pour le backend si nécessaire
      - name: Générer environment.prod.ts
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '/api'
          };
          EOF

      # Construit l’application Angular en mode production
      - name: Construire le bundle de production
        run: npx ng build --configuration production

  # NOTE : owner GHCR en dur (revanito) — si vous forkez sous votre propre compte,
  # remplacez "revanito" par votre login GitHub en minuscules dans les deux jobs ci-dessous.
  backend-image:
    needs: backend-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/revanito/project-devops-backend:latest
            ghcr.io/revanito/project-devops-backend:${{ github.sha }}

  frontend-image:
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/revanito/project-devops-frontend:latest
            ghcr.io/revanito/project-devops-frontend:${{ github.sha }}

  deploy:
    needs: [backend-image, frontend-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # Auth OIDC via une Managed Identity (école bloque la création d'App
      # Registrations classiques -> pas de client secret, fédération de jeton à la place)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group ${{ secrets.AKS_RG }} --name ${{ secrets.AKS_CLUSTER }}

      - name: Inject Commit SHA into Manifests
        run: |
          sed -i "s|ghcr.io/revanito/project-devops-backend:latest|ghcr.io/revanito/project-devops-backend:${{ github.sha }}|g" k8s/02-backend.yaml
          sed -i "s|ghcr.io/revanito/project-devops-frontend:latest|ghcr.io/revanito/project-devops-frontend:${{ github.sha }}|g" k8s/03-frontend.yaml

      - name: Deploy to AKS
        run: kubectl apply -f k8s/

      - name: Deploy Monitoring Stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set-json prometheus.prometheusSpec.podMonitorNamespaceSelector='{}' \
            --set-json prometheus.prometheusSpec.serviceMonitorNamespaceSelector='{}' \
            --wait
